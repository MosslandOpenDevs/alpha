# pnpm 11 reads only auth/registry settings from .npmrc; everything else lives
# here. `node-linker=hoisted` from the old .npmrc was already being ignored in
# production (the live install is the default isolated layout and works), so it
# is dropped rather than reinstated — dev and prod now share one layout.
enablePrePostScripts: true

# Build scripts are opt-in per exact version (pnpm 11 removed
# ignoredBuiltDependencies and defaults strictDepBuilds to true). Pinning the
# version forces a fresh review on upgrade.
allowBuilds:
  "better-sqlite3@12.9.0": true # native SQLite binding — required at runtime
  "esbuild@0.27.7": true # via tsx, used by every cron script
  # sharp was listed here for 0.34.5. next 16.3.4 moved it to 0.35.4, which
  # declares no install/postinstall at all — the @img binaries are plain
  # optional deps — so there is no build to approve and an entry would be a
  # pin nothing reads. Re-add it if a future sharp brings a build script back.

# `pnpm audit --audit-level=high` runs in CI (.github/workflows/ci.yml).
# Not `--prod`: devDependencies run in production here — every cron app is
# `./node_modules/.bin/tsx`, so the dev tree is part of the runtime surface.
# The point is to catch a NEW advisory, so the ones we have already judged are
# listed here with the reason — an unexplained ignore is how the Next.js
# backlog that prompted this got missed in the first place.
#
# Both packages below are pinned inside `next` itself and cannot be moved
# without overriding what Next ships and tests against. Re-check on every Next
# upgrade: `pnpm audit` with this list removed, then delete whatever no longer
# matches. The 16.2.12 → 16.3.4 bump did exactly that to two entries — the
# postcss XSS one (fixed in 8.5.x) and the sharp/libvips one (sharp 0.35.4) —
# so a list that is not re-read on upgrade grows stale ignores, which is the
# same blindness an unexplained ignore causes.
auditConfig:
  ignoreGhsas:
    # postcss 8.5.23, pinned exactly by next. Each of these needs
    # attacker-controlled CSS or a sourceMappingURL in it; the only CSS this
    # build compiles is our own Tailwind input.
    - GHSA-6g55-p6wh-862q # file read via attacker-controlled sourceMappingURL
    - GHSA-r28c-9q8g-f849 # path traversal in previous-source-map auto-loading
    - GHSA-fxqj-rqcc-2cmp # incomplete fix of GHSA-6g55-p6wh-862q
    # nanoid 3.3.x, a dependency of that same postcss. Reached only by
    # postcss's own id generation, never with a caller-supplied size.
    - GHSA-28wg-ghj8-5hjv # non-secure generator loops on a negative size
    - GHSA-2v37-7h3g-55p8 # custom generator loops when size is zero
